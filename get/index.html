<!DOCTYPE html>
<!--
  The app invite's landing page: https://mkayaaslan.github.io/get
  (StoreUrls.inviteLanding, docs/PLAN_1.2.2.md A3). Published on the
  developer site, the repo mkayaaslan.github.io that also serves
  app-ads.txt: this file as get/index.html, icon.png as get/icon.png.

  🔴 One link for every invite, whatever phone either side has: an iPhone
  goes to the App Store, an Android phone to Google Play, anything else sees
  both. The iOS app may not name Google Play (App Review 2.3.10), so the
  invite never carries a store link itself. Invites stay in chats for years:
  this address must keep working.

  🔴 Except inside TikTok. Its in-app browser will not hand a page to a store
  app: on the Play page it opened from the profile link, Play's own buttons
  only got "Action can't be completed" (26 Oct 2026), and TikTok has blocked
  App Store links in bios since 2023. A redirect there leaves the visitor on
  the store's web page with nothing that works, so TikTok gets this page with
  the way out: its ••• menu opens the page in the phone's browser, where the
  redirect above works.

  No cookies, no analytics, nothing loaded from another site: the person
  opening it has not agreed to anything yet. The text follows the phone's
  language, in the app's twelve.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marilo</title>
  <meta name="description" content="See your group on one live map. Get Marilo for iPhone or Android.">
  <!-- The card WhatsApp and Messages show instead of a bare address. Their
       preview crawlers do not run the script below, so they stay here. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Marilo">
  <meta property="og:title" content="Marilo">
  <meta property="og:description" content="See your group on one live map.">
  <meta property="og:url" content="https://mkayaaslan.github.io/get/">
  <meta property="og:image" content="https://mkayaaslan.github.io/get/icon.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      // iPadOS says "Macintosh"; only its touch points give it away.
      var apple = /iPhone|iPad|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var android = !apple && /Android/.test(ua);
      if (/musical_ly|Bytedance/i.test(ua)) {
        document.documentElement.className =
            'tiktok' + (apple ? ' apple' : android ? ' android' : '');
      } else if (apple) {
        location.replace('https://apps.apple.com/app/id6819201049');
      } else if (android) {
        location.replace(
          'https://play.google.com/store/apps/details?id=com.mkayaaslan.rallyo');
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f6f8;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --button: #0f172a;
      --on-button: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0b1120;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #cbd5e1;
        --button: #00b4ff;
        --on-button: #0f172a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(420px, calc(100% - 32px));
      padding: 40px 0;
      text-align: center;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    h1 {
      margin: 16px 0 4px;
      font-size: 28px;
      font-weight: 600;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      text-wrap: balance;
    }
    a {
      display: block;
      margin: 12px 0;
      padding: 14px 20px;
      border-radius: 12px;
      background: var(--button);
      color: var(--on-button);
      font-weight: 600;
      text-decoration: none;
    }
    .hint, .arrow { display: none; }
    .tiktok .hint {
      display: block;
      margin: 0 0 16px;
      padding: 16px;
      border-radius: 12px;
      background: var(--surface);
      text-align: left;
    }
    .hint strong {
      display: block;
      margin-bottom: 4px;
    }
    .hint span {
      color: var(--muted);
      text-wrap: pretty;
    }
    /* Korean breaks between words, not inside them. */
    :lang(ko) { word-break: keep-all; }
    /* Points at TikTok's ••• button, which sits just above this corner. */
    .tiktok .arrow {
      display: block;
      position: fixed;
      top: 4px;
      right: 8px;
      width: 40px;
      height: 40px;
      color: var(--button);
      animation: nudge 1s ease-in-out 3;
    }
    @keyframes nudge {
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tiktok .arrow { animation: none; }
    }
    .tiktok.apple #google-play,
    .tiktok.android #app-store { display: none; }
    .tiktok a {
      background: transparent;
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--muted);
    }
  </style>
</head>
<body>
  <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 20V5M5 12l7-7 7 7" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <main>
    <img src="icon.png" alt="">
    <h1>Marilo</h1>
    <p data-text="tagline">See your group on one live map.</p>
    <div class="hint" role="note">
      <strong data-text="hintTitle">Open this page in your browser</strong>
      <span data-text="hintBody">TikTok can't open the store. Tap ••• at the top right and choose to open in your browser.</span>
    </div>
    <a id="app-store" href="https://apps.apple.com/app/id6819201049" data-text="appStore">Download on the App Store</a>
    <a id="google-play" href="https://play.google.com/store/apps/details?id=com.mkayaaslan.rallyo" data-text="googlePlay">Get it on Google Play</a>
  </main>
  <script>
    (function () {
      var text = {
        en: {
          tagline: "See your group on one live map.",
          hintTitle: "Open this page in your browser",
          hintBody: "TikTok can't open the store. Tap ••• at the top right and choose to open in your browser.",
          appStore: "Download on the App Store",
          googlePlay: "Get it on Google Play"
        },
        tr: {
          tagline: "Grubunu tek bir canlı haritada gör.",
          hintTitle: "Bu sayfayı tarayıcında aç",
          hintBody: "TikTok mağazayı açamıyor. Sağ üstteki ••• simgesine dokun ve tarayıcıda açmayı seç.",
          appStore: "App Store'dan indir",
          googlePlay: "Google Play'den indir"
        },
        de: {
          tagline: "Sieh deine Gruppe auf einer Live-Karte.",
          hintTitle: "Öffne diese Seite in deinem Browser",
          hintBody: "TikTok kann den Store nicht öffnen. Tippe oben rechts auf ••• und öffne die Seite in deinem Browser.",
          appStore: "Laden im App Store",
          googlePlay: "Jetzt bei Google Play"
        },
        nl: {
          tagline: "Zie je groep op één livekaart.",
          hintTitle: "Open deze pagina in je browser",
          hintBody: "TikTok kan de store niet openen. Tik rechtsboven op ••• en open de pagina in je browser.",
          appStore: "Download in de App Store",
          googlePlay: "Ontdek het op Google Play"
        },
        fr: {
          tagline: "Voyez votre groupe sur une seule carte en direct.",
          hintTitle: "Ouvrez cette page dans votre navigateur",
          hintBody: "TikTok ne peut pas ouvrir la boutique d’applications. Touchez ••• en haut à droite, puis ouvrez la page dans votre navigateur.",
          appStore: "Télécharger dans l’App Store",
          googlePlay: "Disponible sur Google Play"
        },
        es: {
          tagline: "Ve a tu grupo en un solo mapa en vivo.",
          hintTitle: "Abre esta página en tu navegador",
          hintBody: "TikTok no puede abrir la tienda de apps. Toca ••• arriba a la derecha y abre la página en tu navegador.",
          appStore: "Descárgalo en el App Store",
          googlePlay: "Disponible en Google Play"
        },
        it: {
          tagline: "Vedi il tuo gruppo su un’unica mappa dal vivo.",
          hintTitle: "Apri questa pagina nel browser",
          hintBody: "TikTok non riesce ad aprire lo store. Tocca ••• in alto a destra e apri la pagina nel browser.",
          appStore: "Scarica su App Store",
          googlePlay: "Disponibile su Google Play"
        },
        pt: {
          tagline: "Veja seu grupo em um único mapa ao vivo.",
          hintTitle: "Abra esta página no navegador",
          hintBody: "O TikTok não consegue abrir a loja de apps. Toque em ••• no canto superior direito e abra a página no navegador.",
          appStore: "Baixar na App Store",
          googlePlay: "Disponível no Google Play"
        },
        ru: {
          tagline: "Вся группа на одной карте в реальном времени.",
          hintTitle: "Открой эту страницу в браузере",
          hintBody: "TikTok не может открыть магазин приложений. Нажми ••• в правом верхнем углу и открой страницу в браузере.",
          appStore: "Скачать в App Store",
          googlePlay: "Доступно в Google Play"
        },
        zh: {
          tagline: "在同一张实时地图上查看你的群组。",
          hintTitle: "请在浏览器中打开此页面",
          hintBody: "TikTok 无法打开应用商店。请点按右上角的 •••，然后选择在浏览器中打开。",
          appStore: "在 App Store 下载",
          googlePlay: "在 Google Play 下载"
        },
        ja: {
          tagline: "グループの居場所を、ライブマップで。",
          hintTitle: "このページをブラウザで開いてください",
          hintBody: "TikTokからはストアを開けません。右上の ••• からブラウザで開いてください。",
          appStore: "App Storeからダウンロード",
          googlePlay: "Google Play で手に入れよう"
        },
        ko: {
          tagline: "그룹 전체를 하나의 실시간 지도에서 확인하세요.",
          hintTitle: "이 페이지를 브라우저에서 여세요",
          hintBody: "TikTok에서는 스토어를 열 수 없어요. 오른쪽 위의 •••을 누르고 브라우저에서 열기를 선택하세요.",
          appStore: "App Store에서 다운로드",
          googlePlay: "Google Play에서 다운로드"
        }
      };
      var root = document.documentElement;
      var wanted = navigator.languages && navigator.languages.length ?
          navigator.languages : [navigator.language || ''];
      var lang = 'en';
      for (var i = 0; i < wanted.length; i++) {
        var code = String(wanted[i]).toLowerCase().split('-')[0];
        if (text[code]) {
          lang = code;
          break;
        }
      }
      root.lang = lang;
      var nodes = document.querySelectorAll('[data-text]');
      for (var j = 0; j < nodes.length; j++) {
        nodes[j].textContent = text[lang][nodes[j].getAttribute('data-text')];
      }

      // Inside TikTok the button asks for the store app itself. Where TikTok
      // lets that through, the store opens; where it does not, TikTok says
      // "Action can't be completed" and the visitor is still here, next to
      // the steps that work. The store's web page would strand them.
      var classes = ' ' + root.className + ' ';
      if (classes.indexOf(' tiktok ') < 0) return;
      if (classes.indexOf(' apple ') >= 0) {
        document.getElementById('app-store').href =
            'itms-apps://apps.apple.com/app/id6819201049';
      } else if (classes.indexOf(' android ') >= 0) {
        document.getElementById('google-play').href =
            'intent://play.google.com/store/apps/details?id=com.mkayaaslan.rallyo' +
            '#Intent;scheme=https;action=android.intent.action.VIEW;' +
            'package=com.android.vending;end';
      }
    })();
  </script>
</body>
</html>
